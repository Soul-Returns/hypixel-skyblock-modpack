[General]
AutomaticJava=true
ConfigVersion=1.3
InstanceType=OneSix
JoinServerOnLaunch=false
MaxMemAlloc=6144
MinMemAlloc=2048
OverrideCommands=true
OverrideJavaArgs=false
OverrideJavaLocation=false
OverrideMemory=true
PermGen=128
PreLaunchCommand="\"$INST_JAVA\" -jar \"$INST_MC_DIR/packwiz-installer-bootstrap.jar\" --bootstrap-no-update --pack-folder \"$INST_MC_DIR\" --timeout 10 https://soul-returns.github.io/hypixel-skyblock-modpack/pack.toml"
iconKey=default
name=Hypixel Skyblock
notes="Preconfigured Hypixel Skyblock modpack.\n\nMods, keybinds and settings sync themselves from\nhttps://soul-returns.github.io/hypixel-skyblock-modpack/pack.toml\non every launch.\n\nDo NOT remove the pre-launch command - it is the updater.\n\nYour own mods are never touched. Your own config edits survive\nunless the pack changes that same file."
